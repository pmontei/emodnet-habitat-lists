[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emodnet-habitat-lists"
version = "0.0.1"
description = "Reference habitat lists and crosswalks across classification systems for EMODnet Seabed Habitats composite products (WP3)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pedro Monteiro", email = "pmontei@ualg.pt" }]
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "pyreadr>=0.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ehl-build = "emodnet_habitat_lists.build:main"

[tool.setuptools.packages.find]
where = ["src"]
